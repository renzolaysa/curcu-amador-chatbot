server {
    listen 8080;
    server_name _;
    client_max_body_size 4k;

    location = /webhook/chatbot-curcuma-amador {
        limit_except POST { deny all; }
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
