services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-gemini-chatbot
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=America/Lima
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n

  webhook-proxy:
    image: nginx:alpine
    container_name: curcu-webhook-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: curcu-webhook-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://webhook-proxy:8080
    depends_on:
      - webhook-proxy

volumes:
  n8n_data:
