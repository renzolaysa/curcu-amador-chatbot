services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-gemini-chatbot
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=America/Lima
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
